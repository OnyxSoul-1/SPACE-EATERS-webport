<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<link rel="stylesheet" href="./style.css"/>
<!-- Official Yandex SDK link -->
<script src="https://yandex.ru/games/sdk/v2"></script>
<style>
    html, body {
        padding: 0; margin: 0; overflow: hidden;
        background: #000000;
        color: #ffffff;
        font-family: 'Courier New', Courier, monospace;
        height: 100%;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
    }
    
    canvas:focus { outline: none; }
    #unity-container { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
    #unity-canvas { width: 100%; height: 100%; background: #000; display: none; }

    #custom-loader {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: #000000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        transition: opacity 0.3s ease-out;
    }

    .title {
        position: absolute;
        top: 20px;
        font-size: 14px;
        letter-spacing: 4px;
        color: #888888;
        text-transform: uppercase;
    }

    /* RAINBOW CREDIT */
    .credit {
        position: absolute;
        bottom: 20px;
        font-size: 12px;
        letter-spacing: 1px;
        background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8f00ff, #ff0000);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: rainbow 3s linear infinite;
        font-weight: bold;
    }

    @keyframes rainbow { to { background-position: 200% center; } }

    .loading-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 300px;
    }

    #status-text {
        font-size: 12px;
        color: #aaaaaa;
        margin-bottom: 15px;
        text-align: center;
        height: 15px;
    }

    .progress-container {
        width: 100%;
        height: 2px;
        background: #222222;
    }

    #progress-bar {
        height: 100%;
        width: 0%;
        background: #ffffff;
        transition: width 0.1s linear;
    }
</style>
</head>
<body class="dark">

<div id="custom-loader">
    <div class="title">SPACE EATERS</div>
    
    <div class="loading-box">
        <div id="status-text">Initializing systems...</div>
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>
    </div>

    <div class="credit">Port by Onyx$oul-1</div>
</div>

<div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
</div>

<script>
    const hideFullScreenButton = "";
    const buildUrl = "./";
    const loaderUrl = buildUrl + "relise.loader.js";

    const canvas = document.querySelector("#unity-canvas");
    const loaderUI = document.querySelector("#custom-loader");
    const progressBar = document.querySelector("#progress-bar");
    const statusText = document.querySelector("#status-text");

    let StartUnityInstance;
    let ygGameInstance = null;
    let ysdk = null;
    let initYSDK = false;
    let initGame = false;
    let syncInit = true;
    const NO_DATA = 'no data';

    document.addEventListener('contextmenu', event => event.preventDefault());
    function FocusGame() { window.focus(); canvas.focus(); }
    window.addEventListener('pointerdown', () => FocusGame());
    window.addEventListener('touchstart', () => FocusGame());

    document.addEventListener('visibilitychange', function () {
        if (ysdk !== null && initGame == true) {
            if (document.hidden) {
                YG2Instance('SetFocusWindowGame', 'false');
            } else {
                YG2Instance('SetFocusWindowGame', 'true');
                if ((ysdk.deviceInfo.isMobile() || ysdk.deviceInfo.isTablet()) && ysdk.screen.fullscreen.status == 'off')
                    ysdk.screen.fullscreen.request();
            }
        }
    });

    async function fetchAndMergeChunks(partUrls, label) {
        let buffers = [];
        for (let i = 0; i < partUrls.length; i++) {
            statusText.innerText = `Downloading ${label} [${i + 1}/${partUrls.length}]...`;
            const response = await fetch(partUrls[i]);
            if (!response.ok) throw new Error("Could not load file: " + partUrls[i]);
            buffers.push(await response.arrayBuffer());
        }
        statusText.innerText = `Merging ${label}...`;
        return URL.createObjectURL(new Blob(buffers, { type: 'application/octet-stream' }));
    }

    const script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
        StartUnityInstance = async function () {
            try {
                const mergedDataUrl = await fetchAndMergeChunks([
                    buildUrl + "relise.data.br.part1", 
                    buildUrl + "relise.data.br.part2",
                    buildUrl + "relise.data.br.part3"
                ], "data");

                const mergedCodeUrl = await fetchAndMergeChunks([
                    buildUrl + "relise.wasm.br.part1", 
                    buildUrl + "relise.wasm.br.part2"
                ], "wasm");

                statusText.innerText = "Starting Unity Engine...";

                const config = {
                    dataUrl: mergedDataUrl,
                    frameworkUrl: buildUrl + "relise.framework.js.br",
                    codeUrl: mergedCodeUrl,
                    streamingAssetsUrl: "StreamingAssets",
                    companyName: "Bullet _ Rezero",
                    productName: "SPACE EATERS",
                    productVersion: "0.4.4.5"
                };

                createUnityInstance(canvas, config, (progress) => {
                    const percent = Math.round(progress * 100);
                    statusText.innerText = `Loading... ${percent}%`;
                    progressBar.style.width = `${percent}%`;
                }).then((unityInstance) => {
                    ygGameInstance = unityInstance;
                    
                    loaderUI.style.opacity = '0';
                    setTimeout(() => {
                        loaderUI.style.display = 'none';
                        canvas.style.display = 'block';
                    }, 300);
                    
                }).catch((message) => {
                    statusText.innerText = "Error: " + message;
                    console.error(message);
                });

            } catch (err) {
                statusText.innerText = "Failed to load game files.";
                console.error("File Merge Error: ", err);
            }
        };
        
        if (IsLocalHost() || syncInit) StartUnityInstance_IfUnloaded();
    };

    function StartUnityInstance_IfUnloaded() {
        if (loaderUI.style.display !== "none") StartUnityInstance();
    }

    function IsLocalHost() {
        try {
            if (window.top !== window) return false;
            const host = window.location.hostname;
            if (host === "localhost" || host === "127.0.0.1" || host.endsWith(".local")) return true;
        } catch (error) { return false; }
    }

    function YG2Instance(method, arg) {
        if (ygGameInstance == null) return;
        if (!initGame) {
            setTimeout(function () { if (ygGameInstance) ygGameInstance.SendMessage('YG2Instance', method, arg); }, 100);
        } else {
            ygGameInstance.SendMessage('YG2Instance', method, arg);
        }
    }
    function LogStyledMessage(message) { console.log('%c' + message, 'color: #FFDF73; background-color: #454545'); }

    InitYSDK();
    async function InitYSDK() {
        try {
            if (IsLocalHost()) return;
            ysdk = await YaGames.init();
            
            try {
                if (ysdk.environment && ysdk.environment.i18n) {
                    ysdk.environment.i18n.lang = "en";
                    ysdk.environment.i18n.tld  = "com";
                }
            } catch (e) {}

            InterAdvShow();
            await RequestingEnvironmentData();
            await InitPlayer();
            await LoadCloud();
            
            initYSDK = true;
            if (ygGameInstance != null) ygGameInstance.SendMessage('YG2Instance', 'InitSDKComplete');
            LogStyledMessage('Init YandexSDK Success');
        } catch (e) {
            console.error('CRASH Initialization SDK: ', e);
        }
        if (!IsLocalHost() && !syncInit) StartUnityInstance_IfUnloaded();
    }

    function InitGame() {
        initGame = true;
        setTimeout(function () { if (nowFullAdOpen == true) YG2Instance('OpenInterAdv'); }, 100);
    }

    LogStyledMessage('PluginYG2 v2.0032  build: 39');
    var cloudSaves = NO_DATA;

    function SaveCloud(jsonData, flush) {
        if (player == null) return;
        try { player.setData({ saves: [jsonData] }, flush); } catch (e) {}
    }

    function LoadCloud() {
        return new Promise((resolve) => {
            if (ysdk == null) { Final(NO_DATA); return; }
            try {
                player.getData(["saves"]).then(data => {
                    if (data.saves) Final(JSON.stringify(data.saves));
                    else Final(NO_DATA);
                }).catch(() => Final(NO_DATA));
            } catch (e) { Final(NO_DATA); }
            function Final(res) { cloudSaves = res; YG2Instance('SetLoadSaves', res); resolve(res); }
        });
    }

    function RewardedAdvShow(id) {
        try {
            ysdk.adv.showRewardedVideo({
                callbacks: {
                    onOpen: () => { YG2Instance('OpenRewardedAdv'); },
                    onClose: () => { YG2Instance('CloseRewardedAdv'); FocusGame(); },
                    onRewarded: () => { YG2Instance('RewardAdv', id); },
                    onError: (err) => { YG2Instance('ErrorRewardedAdv'); }
                }
            });
        } catch (err) {}
    }

    let nowFullAdOpen = false;
    function InterAdvShow() {
        try {
            if (nowFullAdOpen !== true && ysdk !== null) {
                ysdk.adv.showFullscreenAdv({
                    callbacks: {
                        onOpen: () => { nowFullAdOpen = true; if (initGame === true) YG2Instance('OpenInterAdv'); },
                        onClose: (wasShown) => {
                            nowFullAdOpen = false;
                            if (initGame === true) YG2Instance('CloseInterAdv', wasShown ? 'true' : 'false');
                            FocusGame();
                        },
                        onError: (error) => { YG2Instance('ErrorInterAdv'); FocusGame(); }
                    }
                });
            }
        } catch (e) {}
    }

    var environmentData = NO_DATA;
    function RequestingEnvironmentData() {
        return new Promise((resolve) => {
            if (ysdk == null) { Final(NO_DATA); return; }
            try {
                let jsonEnvir = {
                    "language": "en", 
                    "domain":   "com",
                    "deviceType": ysdk.deviceInfo.type,
                    "isMobile": ysdk.deviceInfo.isMobile(),
                    "isDesktop": ysdk.deviceInfo.isDesktop(),
                    "isTablet": ysdk.deviceInfo.isTablet(),
                    "isTV": ysdk.deviceInfo.isTV(),
                    "appID": ysdk.environment.app.id,
                    "browserLang": ysdk.environment.browser.lang,
                    "payload": ysdk.environment.payload,
                    "platform": navigator.platform
                };
                Final(JSON.stringify(jsonEnvir));
            } catch (e) { Final(NO_DATA); }
            function Final(res) { environmentData = res; YG2Instance('SetEnvirData', res); resolve(res); }
        });
    }

    var playerData = NO_DATA;
    let player = null;
    function InitPlayer() {
        return new Promise((resolve) => {
            try {
                if (ysdk == null) { Final(NotAuthorized()); }
                else {
                    ysdk.getPlayer({ scopes: true }).then(_player => {
                        player = _player;
                        if (player.getMode() === 'lite') {
                            Final(NotAuthorized());
                        } else {
                            Final(JSON.stringify({
                                "playerAuth": "resolved",
                                "playerName": player.getName(),
                                "playerId": player.getUniqueID(),
                                "playerPhoto": player.getPhoto('medium'),
                                "payingStatus": player.getPayingStatus()
                            }));
                        }
                    }).catch(e => Final(NotAuthorized()));
                }
            } catch (e) { Final(NotAuthorized()); }
            function Final(res) { playerData = res; YG2Instance('SetAuth', res); resolve(res); }
        });
    }

    function NotAuthorized() {
        return JSON.stringify({ "playerAuth": "rejected", "playerName": "unauthorized", "playerId": "unauthorized", "playerPhoto": "null", "payingStatus": "unknown" });
    }

    function OpenAuthDialog() {
        if (ysdk !== null) {
            try {
                ysdk.auth.openAuthDialog().then(() => { InitPlayer(true).then(() => YG2Instance('GetDataInvoke')); });
            } catch (e) {}
        }
    }

    document.body.appendChild(script);
</script>
</body>
</html>
